name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The verdict job reads this run's jobs through the GitHub API.
permissions:
  contents: read
  actions: read

jobs:
  # Parallax builds itself the way it asks others to: twice, on CRACI runners.
  build:
    name: build (${{ matrix.twin }})
    runs-on: craci
    strategy:
      fail-fast: false
      matrix:
        twin: [bare, decoy]
    steps:
      - uses: cracicorp/setup@v1
        with:
          size: "2"
      - uses: actions/checkout@v4
      - name: Dress this twin
        uses: ./dress
        with:
          twin: ${{ matrix.twin }}
      - uses: oven-sh/setup-bun@v2
      - run: plx-run bun install --frozen-lockfile
      - run: plx-run bun test
      - run: plx-run bunx tsc --noEmit

  # The judge sits outside the build network: CRACI does not let a job on its
  # runners read CRACI's records, so this one job is GitHub-hosted.
  verdict:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parallax verdict
        uses: ./verdict
        with:
          craci-token: ${{ secrets.CRACI_API_TOKEN }}
          github-token: ${{ github.token }}
