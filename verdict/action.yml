name: Parallax verdict
description: >
  Judge this run from what CRACI recorded: compare the bare and the decoy twin (network traces and SBOMs),
  then ask every other detector about the same jobs (new egress, cache lineage, same URL new bytes,
  image provenance, registry 404). Fails the job when any of them found something.

inputs:
  craci-token:
    description: CRACI API token (Settings, API tokens).
    required: true
  github-token:
    description: GitHub token that can read this repo's Actions runs and jobs (actions read).
    required: false
    default: ${{ github.token }}
  allow-inconclusive:
    description: "Set to true to pass when Parallax could not compare the twins (missing trace, twin failed early)."
    required: false
    default: "false"
  history:
    description: How many earlier bare runs of this repo to compare against, to filter out connections that come and go. 0 = no history at all (new egress is then not judged).
    required: false
    default: "5"

outputs:
  status:
    description: "The twin diff alone: clean, divergent or inconclusive"
    value: ${{ steps.verdict.outputs.status }}
  result:
    description: "All detectors together: pass, fail, inconclusive or error"
    value: ${{ steps.verdict.outputs.result }}
  caught-by:
    description: "The detectors that found something, comma separated (twins, new egress, cache lineage, same URL, new bytes, image provenance, registry 404)"
    value: ${{ steps.verdict.outputs.caught_by }}

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2

    - id: verdict
      shell: bash
      env:
        CRACI_API_TOKEN: ${{ inputs.craci-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PLX_RUNS_DIR: ${{ runner.temp }}/parallax
        PLX_ALLOW_INCONCLUSIVE: ${{ inputs.allow-inconclusive }}
        PLX_HISTORY: ${{ inputs.history }}
      run: |
        set +e
        bun "$GITHUB_ACTION_PATH/../src/cli.ts" verdict \
          --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" \
          --history "$PLX_HISTORY" --summary "$GITHUB_STEP_SUMMARY"
        code=$?
        set -e
        case "$code" in
          0) result=pass ;;
          1) result=fail ;;
          2) result=inconclusive ;;
          *) result=error ;;
        esac
        echo "result=$result" >> "$GITHUB_OUTPUT"
        # The CLI writes status= and caught_by= itself; when it stopped before that, say so.
        grep -q '^status=' "$GITHUB_OUTPUT" || echo "status=inconclusive" >> "$GITHUB_OUTPUT"
        caught=$(grep '^caught_by=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
        if [ "$result" = pass ]; then exit 0; fi
        if [ "$result" = inconclusive ] && [ "$PLX_ALLOW_INCONCLUSIVE" = true ]; then
          echo "::warning::Parallax could not compare the twins (inconclusive). Passing because allow-inconclusive is true."
          exit 0
        fi
        if [ "$result" = fail ]; then
          echo "::error::Parallax stopped this run. Caught by: ${caught:-see the job summary}. See the job summary."
        elif [ "$result" = inconclusive ]; then
          echo "::error::Parallax could not compare the twins (inconclusive). See the job summary."
        else
          echo "::error::Parallax stopped with an error (exit code $code)."
        fi
        exit 1
