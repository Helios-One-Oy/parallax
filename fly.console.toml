# Parallax console, public mode: holds what the box pushes to POST /ingest. No GitHub token, no write action.
#   hsec exec --only FLY_API_TOKEN -- fly deploy --remote-only --ha=false -c fly.console.toml --ignorefile Dockerfile.console.dockerignore
app = "parallax-console"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile.console"

[env]
  PORT = "8080"
  PLX_MODE = "public"

[http_service]
  internal_port = 8080
  force_https = true
  # The snapshot lives in memory: keep the one machine running. (After a restart the pusher sends it again.)
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
